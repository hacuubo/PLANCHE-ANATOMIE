<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icône « planche » : silhouette anatomique au trait d'encre, aplat rouge sur les ventricules,
       oreillette mauve, tronc pulmonaire bleu, pastille numérotée avec ligne de rappel. -->
  <rect width="64" height="64" rx="14" fill="#f4efe6"/>
  <g stroke="#2b2420" stroke-linecap="round" stroke-linejoin="round">
    <!-- aorte : crosse qui monte de la base et redescend à droite -->
    <path d="M31 31C30 20 34 13 42 13c7 0 9 6 9 15" fill="none" stroke-width="9.6"/>
    <path d="M31 31C30 20 34 13 42 13c7 0 9 6 9 15" fill="none" stroke="#b8433c" stroke-width="6.4"/>
    <!-- tronc pulmonaire, en avant et à gauche de l'aorte -->
    <path d="M25 31c-1-6 3-10 12-9" fill="none" stroke-width="7.4"/>
    <path d="M25 31c-1-6 3-10 12-9" fill="none" stroke="#3e519e" stroke-width="4.6"/>
    <!-- oreillette droite -->
    <ellipse cx="17.5" cy="29.5" rx="7.5" ry="6.5" fill="#a98bb8" stroke-width="1.6"/>
    <!-- masse ventriculaire, apex en bas à droite (côté gauche du patient) -->
    <path d="M15.5 34C13 44 27 56 44.5 57.5 50.5 52 51.5 40 47 30.5 40 26 22 26 15.5 34Z" fill="#b8433c" stroke-width="1.7"/>
    <!-- sillon interventriculaire antérieur -->
    <path d="M30.5 29.5c3 8 8 16 13 25" fill="none" stroke="#f0c070" stroke-width="2.2"/>
    <path d="M30.5 29.5c3 8 8 16 13 25" fill="none" stroke="#7a2b26" stroke-width=".8"/>
    <!-- ligne de rappel et pastille -->
    <path d="M38 41L52 44" fill="none" stroke-width=".9"/>
    <circle cx="38" cy="41" r="1" fill="#2b2420" stroke="none"/>
    <circle cx="54.5" cy="44.5" r="4.6" fill="#fffdf9" stroke-width=".9"/>
  </g>
  <text x="54.5" y="46.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6.2" font-weight="600" fill="#2b2420">1</text>
</svg>
