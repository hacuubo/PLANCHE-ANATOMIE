<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planche d'anatomie — Le cœur</title>
  <meta name="description" content="Le cœur en 3D qui bat, s'ouvre et se tourne, pour l'expliquer aux patients.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="canonical" href="https://cardioexplain.com/">
  <!-- aperçu de lien (Open Graph, réseaux, messageries) : image générée par tools/make-og.mjs -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Planche cœur">
  <meta property="og:url" content="https://cardioexplain.com/">
  <meta property="og:title" content="Planche cœur — le cœur en 3D, pour l'expliquer aux patients">
  <meta property="og:description" content="Il bat, se tourne et s'ouvre en coupe : montrez au patient ses cavités, ses valves et le trajet du sang. S'installe depuis le navigateur, fonctionne hors ligne.">
  <meta property="og:image" content="https://cardioexplain.com/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cœur en 3D ouvert en coupe, à côté du titre « Le cœur en 3D, pour l'expliquer aux patients ».">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.6 4.5c2 0 3.4 1.1 4.4 2.5 1-1.4 2.4-2.5 4.4-2.5 3.6 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <div>
        <div class="title">Planche d'anatomie</div>
        <div class="subtitle">Le cœur et ses vaisseaux</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="install" class="btn ghost hidden" type="button">Installer l'application</button>
      <button id="panel-toggle" class="btn ghost only-mobile" type="button" aria-label="Afficher les points de vue et les structures">Menu</button>
    </div>
  </header>

  <main class="layout">
    <section id="scene" class="scene" aria-label="Modèle 3D du cœur">
      <div class="tools">
        <div class="toolbar" role="toolbar" aria-label="Affichage">
          <span class="tool-group" aria-label="Modes">
            <button class="tool mode" data-toggle="coupe" type="button" aria-pressed="false" title="Ouvrir le cœur pour voir les cavités"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="11.5" r="2"/><circle cx="4.5" cy="4.5" r="2"/><path d="M6 6l8 7M6 10l8-7"/></svg>Coupe</button>
            <button class="tool mode" data-toggle="valves" type="button" aria-pressed="false" title="Voir chaque valve en gros plan, comme le chirurgien : normale ou malade"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 8V2.2M8 8l5 2.9M8 8l-5 2.9"/></svg>Valves</button>
            <button class="tool mode" data-toggle="circulation" type="button" aria-pressed="false" title="Suivre le trajet du sang, étape par étape"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></svg>Circulation</button>
          </span>
          <span class="tool-sep" aria-hidden="true"></span>
          <span class="tool-group" aria-label="Options">
            <button class="tool option beat-btn" data-toggle="battement" type="button" aria-pressed="true" title="Mettre le battement en pause ou le relancer"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ic-pause" d="M5.5 3.5v9M10.5 3.5v9"/><path class="ic-play" d="M5 3l8 5-8 5z"/></svg><span class="beat-txt">Pause</span></button>
          </span>
        </div>
        <div id="cut-tools" class="cut-tools hidden">
          <div class="seg">
            <button data-cut="cinq-cavites" class="active" type="button" title="Coupe 5 cavités passant par le centre des valves tricuspide, mitrale et aortique">5 cavités</button>
            <button data-cut="valves" type="button" title="Base du cœur coupée à plat, oreillettes retirées : les quatre valves vues d’en haut">4 valves</button>
            <button data-cut="chirurgien" type="button" title="Petit axe de la valve mitrale vue depuis l'oreillette gauche, aorte en haut (vue du chirurgien, ETO 3D)">Vue chirurgien</button>
            <button data-cut="frontale" type="button">Frontale</button>
            <button data-cut="horizontale" type="button">Horizontale</button>
          </div>
          <label id="cut-depth-wrap">Profondeur <input id="cut-depth" type="range" min="-5" max="5" step="0.1" value="0.4"></label>
        </div>
        <div id="valve-tools" class="cut-tools valve-tools hidden">
          <div class="seg" role="group" aria-label="Valve">
            <button data-valve="aortique" type="button">Aortique</button>
            <button data-valve="mitrale" type="button">Mitrale</button>
            <button data-valve="tricuspide" type="button">Tricuspide</button>
          </div>
          <div class="seg" id="valve-variants" role="group" aria-label="Variante"></div>
          <div class="seg" role="group" aria-label="Position de la valve">
            <button data-vphase="ferme" class="active" type="button">Fermée</button>
            <button data-vphase="ouvert" type="button">Ouverte</button>
          </div>
        </div>
      </div>
      <div class="bottombar">
        <span class="orient"><b>D</b> ← patient → <b>G</b></span>
      </div>
    </section>

    <aside id="panel" class="panel">
      <button id="panel-handle" class="handle only-mobile" type="button" aria-label="Ouvrir ou fermer le panneau"><span></span></button>
      <div class="panel-inner">
        <div id="fiche" class="fiche"></div>
        <h3 class="section-title">Points de vue</h3>
        <div id="views" class="views"></div>
        <h3 class="section-title">Structures</h3>
        <div id="structures" class="structures"></div>
        <p class="footnote">Modèle à visée pédagogique, il ne remplace pas l'avis de votre médecin. Géométrie d'après <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/" target="_blank" rel="noopener">BodyParts3D</a>, © The Database Center for Life Science, licence <a href="https://creativecommons.org/licenses/by/4.0/deed.fr" target="_blank" rel="noopener">CC BY 4.0</a> ; myocarde ventriculaire reconstruit.</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
